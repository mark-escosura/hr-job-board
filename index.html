<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HR Jobs</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR Jobs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #F2F2F7;
  color: #1C1C1E;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100dvh;
  overflow-x: hidden;
}
body { padding-top: env(safe-area-inset-top); }
a { color: inherit; text-decoration: none; }
.top {
  position: sticky; top: 0; z-index: 2;
  background: #F2F2F7;
  padding: 6px 0 12px;
}
header.app { padding: 0 20px 12px; }
header.app h1 {
  font-size: 28px; font-weight: 700;
  letter-spacing: -0.045em; line-height: 1.15;
}
header.app .sub {
  margin-top: 3px; font-size: 13px; font-weight: 500;
  color: #8E8E93; letter-spacing: -0.01em;
}
.search {
  margin: 0 20px;
  height: 36px;
  background: #E3E3E8;
  border-radius: 10px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px;
  color: #8E8E93;
}
.search svg { flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent;
  font: inherit; font-size: 16px; color: #1C1C1E;
  outline: none; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: #8E8E93; }
.list {
  padding: 0 16px calc(28px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 10px;
}
.card {
  display: block;
  background: #fff;
  border-radius: 16px;
  padding: 14px 14px 13px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
}
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.title { font-size: 16px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; }
.new {
  display: inline-block; vertical-align: 2px; margin-left: 6px;
  background: #FF3B30; color: #fff;
  font-size: 9px; font-weight: 700; letter-spacing: .06em;
  padding: 2px 5px; border-radius: 4px; line-height: 1;
}
.company {
  margin-top: 3px; font-size: 13px; font-weight: 500;
  color: #636366; letter-spacing: -0.01em;
}
.meta {
  margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 12px; font-weight: 500; color: #8E8E93;
}
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #C7C7CC; }
.pay {
  display: inline-block; margin-top: 10px;
  font-size: 12.5px; font-weight: 600; color: #0E7A4A;
  background: #E8F7EE; padding: 4px 8px; border-radius: 7px;
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.apply {
  flex: none; align-self: center; color: #007AFF;
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  padding: 6px 2px 6px 8px; white-space: nowrap;
}
.empty { padding: 28px 16px; text-align: center; color: #8E8E93; font-size: 15px; }
</style>
</head>
<body>
  <div class="top">
    <header class="app">
      <h1>HR Jobs</h1>
      <p class="sub" id="sum">Loading…</p>
    </header>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <circle cx="6.4" cy="6.4" r="4.6" stroke="#8E8E93" stroke-width="1.6"/>
        <path d="M9.8 9.8 13.2 13.2" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="search" id="q" placeholder="Title or company" autocomplete="off" enterkeyhint="search">
    </div>
  </div>
  <div class="list" id="list"></div>
<script>
const MAX_AGE_DAYS = 30, $ = id => document.getElementById(id);
const pt = d => new Intl.DateTimeFormat('en-CA', {timeZone:'America/Los_Angeles'}).format(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const foundLabel = day => {
  const [, m, d] = day.split('-');
  return months[Number(m) - 1] + ' ' + Number(d);
};
const formatPay = p => String(p).trim()
  .replace(/\s*Annually\s*/i, '/yr')
  .replace(/\s*per year\s*/i, '/yr')
  .replace(/\s*a year\s*/i, '/yr')
  .replace(/\s*-\s*/g, '–')
  .replace(/(\d),(\d{3})\.00(?!\d)/g, '$1,$2')
  .replace(/\s+\/yr/i, '/yr');
const today = pt(new Date()), cutoff = pt(new Date(Date.now() - MAX_AGE_DAYS * 864e5));
let leads = [];

function card(j) {
  const badge = j.found === today ? '<span class="new">NEW</span>' : '';
  const city = (j.city || '').replace(/, CA$/, '');
  const bits = [];
  if (city) bits.push(esc(city));
  if (j.found) bits.push(esc(foundLabel(j.found)));
  if (j.employment_type) bits.push(esc(j.employment_type));
  const meta = bits.map(b => '<span>' + b + '</span>').join('<span class="dot"></span>');
  const pay = j.pay ? '<span class="pay">' + esc(formatPay(j.pay)) + '</span>' : '';
  const apply = j.url ? '<span class="apply">Apply</span>' : '';
  const inner = '<div class="card-top"><div><div class="title">' + esc(j.title || '—') + badge +
    '</div>' + (j.company ? '<div class="company">' + esc(j.company) + '</div>' : '') +
    '</div>' + apply + '</div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + pay;
  if (j.url) return '<a class="card" href="' + esc(j.url) + '" target="_blank" rel="noopener">' + inner + '</a>';
  return '<div class="card">' + inner + '</div>';
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = leads.filter(j => !q || (j.title + ' ' + j.company).toLowerCase().includes(q));
  const nNew = shown.filter(j => j.found === today).length;
  $('list').innerHTML = shown.map(card).join('') || '<p class="empty">No leads match.</p>';
  const n = shown.length, total = leads.length;
  const leadWord = (n === 1 ? 'lead' : 'leads');
  $('sum').textContent = (q && n !== total ? n + ' of ' + total + ' leads' : n + ' ' + leadWord) +
    ' · ' + nNew + ' new today';
}

fetch('leads.json', {cache:'no-cache'}).then(r => r.json()).then(data => {
  leads = data.map(j => ({...j, found: j.first_seen ? pt(new Date(j.first_seen)) : null}))
    .filter(j => j.found && j.found >= cutoff);
  $('q').addEventListener('input', render);
  render();
}).catch(() => { $('sum').textContent = 'Could not load leads.'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
